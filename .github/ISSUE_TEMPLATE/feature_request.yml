name: Feature or rule change
description: A new key, rule, error message or published field, or a change to an existing one.
labels: [enhancement]
body:
  - type: textarea
    id: want
    attributes:
      label: What you want to write, and what it should do
      description: Show the modules tree or module file you want to write, and say what a host should get from it.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What happens today
      description: Say what dirs-as-categories does with that tree now, and quote the rule in doc/convention.md that decides it if you found one.

  - type: textarea
    id: breaks
    attributes:
      label: Who it would break
      description: Describe a tree that works today and would behave differently. "None that I know of" is a fine answer.
